<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f4ef" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.mindcoachbot.ru; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Jung Control</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css?v=20260822-admin-1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./config.js?v=20260822-admin-1"></script>
    <script src="./admin.js?v=20260822-admin-1" defer></script>
  </head>
  <body>
    <div class="control-shell">
      <header class="control-header">
        <div>
          <p class="eyebrow">Владелец · без психосодержимого</p>
          <h1>Jung Control</h1>
        </div>
        <button id="refresh" class="icon-button" type="button" aria-label="Обновить данные">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
            <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
          </svg>
        </button>
      </header>

      <nav class="control-tabs" aria-label="Разделы Jung Control" role="tablist">
        <button
          id="tab-overview"
          class="control-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="overview-panel"
          data-tab="overview"
        >
          Обзор
        </button>
        <button
          id="tab-user"
          class="control-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="user-panel"
          data-tab="user"
          tabindex="-1"
        >
          Пользователь
        </button>
      </nav>

      <main>
        <section
          id="overview-panel"
          class="control-panel"
          role="tabpanel"
          aria-labelledby="tab-overview"
        >
          <div class="filter-bar" role="group" aria-label="Срез аналитики">
            <label>
              <span>Период</span>
              <select id="window-filter">
                <option value="7">7 дней</option>
                <option value="30" selected>30 дней</option>
                <option value="all">Всё время</option>
              </select>
            </label>
            <label>
              <span>Источник</span>
              <select id="source-filter">
                <option value="">Все источники</option>
              </select>
            </label>
          </div>
          <div id="overview-content" aria-live="polite" aria-busy="true">
            <div class="loading-card" role="status">
              <span class="spinner" aria-hidden="true"></span>
              <span>Собираю рабочий срез…</span>
            </div>
          </div>
        </section>

        <section
          id="user-panel"
          class="control-panel"
          role="tabpanel"
          aria-labelledby="tab-user"
          hidden
        >
          <form id="user-search" class="search-card" novalidate>
            <div class="search-copy">
              <h2>Найти пользователя</h2>
              <p>Только служебный статус. Переписка и психологический профиль не загружаются.</p>
            </div>
            <label for="telegram-id">Telegram ID</label>
            <div class="search-row">
              <input
                id="telegram-id"
                name="telegram_id"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                pattern="[0-9]+"
                maxlength="20"
                required
              />
              <button class="primary-button" type="submit">Найти</button>
            </div>
            <p id="search-error" class="field-error" role="alert" hidden></p>
          </form>
          <div id="user-content" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <p id="action-status" class="sr-only" role="status" aria-live="polite"></p>
  </body>
</html>
